---
- name: Varmuuskopioi reitittimien konfiguraatiot
  hosts: routers
  gather_facts: false

  tasks:
    - name: Hae FRRouting-konfiguraatio
      ansible.builtin.raw: vtysh -c "show running-config"
      register: config
      changed_when: false

    - name: Hae IP-osoitteet
      ansible.builtin.raw: ip -4 -o addr show
      register: ip_config
      changed_when: false

    - name: Tallenna varmuuskopio
      ansible.builtin.copy:
        content: |
          {{ config.stdout }}

          ! Linux IP-osoitteet
          {{ ip_config.stdout }}
        dest: "/root/automation-lab/backups/{{ inventory_hostname }}.conf"
      delegate_to: localhost
